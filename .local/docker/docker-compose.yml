name: cocos-challenge

services:
  postgres:
    image: postgres:18-alpine
    container_name: cocos-psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cocos
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cocos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
